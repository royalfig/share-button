<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep Dive into Web Components</title>
    <meta property="og:image" content="/media/img.jpg" />
    <meta name="color-scheme" content="dark light" />
    <script type="module" src="./src/main.ts"></script>
    <style>
      html {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      body {
        display: grid;
        height: 100lvh;
        place-items: center;
      }

      ::part(share-link, facebook) {
        color: red;
      }
    </style>
  </head>
  <body>
    <share-button circle color-popover-bg="red"></share-button>
    <share-button icon="2">Share</share-button>
    <share-button atomic networks="threads"></share-button>

    <share-button color-button-bg="red" color-popover-bg="blue"></share-button>
    <share-button position="left" icon="3"></share-button>
    <share-button position="right" icon="5"></share-button>
    <share-button position="center" icon="2"></share-button>
  </body>
</html>
